name: Project CI

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "mobile/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "backend/**"
      - "mobile/**"
      - ".github/workflows/**"

concurrency:
  group: project-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run backend tests
        working-directory: backend
        run: npm test

  mobile-tests-and-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Run mobile unit tests
        working-directory: mobile
        run: npm test
      - name: Check Expo project health
        working-directory: mobile
        run: npx expo-doctor
      - name: Export Android JavaScript bundle
        working-directory: mobile
        run: npx expo export --platform android --output-dir dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --non-interactive
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - name: Install and launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install mobile/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.legendai.agent -c android.intent.category.LAUNCHER 1
            sleep 5 && adb shell pidof com.legendai.agent
      - uses: actions/upload-artifact@v4
        with:
          name: my-ai-agent-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
