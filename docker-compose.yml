services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: legend_ai
      POSTGRES_USER: legend_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your private .env file}
    volumes:
      - legend_ai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legend_ai -d legend_ai"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://legend_ai:${POSTGRES_PASSWORD}@database:5432/legend_ai
      DATABASE_SSL: "false"
      APP_API_TOKEN: ${APP_API_TOKEN:?Set APP_API_TOKEN in your private .env file}
      AI_API_KEY: ${AI_API_KEY:?Set AI_API_KEY in your private .env file}
      AI_MODEL: ${AI_MODEL:-gpt-6.1-sol}
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [private]

networks:
  private:

volumes:
  legend_ai_postgres:
