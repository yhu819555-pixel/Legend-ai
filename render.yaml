services:
  - type: web
    name: legend-ai-api
    runtime: node
    plan: free
    region: singapore
    branch: feature/mvp-foundation
    rootDir: backend
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: APP_API_TOKEN
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4.1-mini
